name: G1-C local chat-host probe
on:
  pull_request:
    paths:
      - 'experiments/chat-host/**'
      - 'tests/fixtures/zmachine/fixture.z5'
      - '.github/workflows/chat-host-probe-smoke.yml'
  push:
    branches: [main, codex/issue-13-g1c-chat-host-probe]
    paths:
      - 'experiments/chat-host/**'
      - '.github/workflows/chat-host-probe-smoke.yml'
permissions:
  contents: read
jobs:
  local-probe:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: experiments/chat-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: experiments/chat-host/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
